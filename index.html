<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaTrade AI | Trading Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050b16;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* ANIMATED BACKGROUND */
body::before,
body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.12;
    z-index:-1;
    animation:float 8s ease-in-out infinite alternate;
}

body::before{
    background:#00e5ff;
    top:-150px;
    left:-150px;
}

body::after{
    background:#7c3cff;
    right:-150px;
    bottom:-150px;
    animation-delay:2s;
}

@keyframes float{
    from{transform:translate(0,0) scale(1);}
    to{transform:translate(60px,40px) scale(1.2);}
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:100;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(5,12,25,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:24px;
    font-weight:bold;
    letter-spacing:1px;
}

.logo span{
    color:#00e5ff;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    color:#9fb0c8;
    font-size:13px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#00ff88;
    box-shadow:0 0 15px #00ff88;
    animation:pulse 1.4s infinite;
}

@keyframes pulse{
    50%{
        opacity:.35;
        transform:scale(.65);
    }
}

/* MAIN */
.container{
    width:92%;
    max-width:1400px;
    margin:30px auto;
}

/* HERO */
.hero{
    padding:35px;
    border-radius:25px;
    background:
        linear-gradient(
            135deg,
            rgba(0,229,255,.11),
            rgba(124,60,255,.13)
        );
    border:1px solid rgba(255,255,255,.08);
    animation:slideUp .8s ease;
    position:relative;
    overflow:hidden;
}

.hero::after{
    content:"";
    position:absolute;
    width:200px;
    height:200px;
    border:1px solid rgba(0,229,255,.2);
    border-radius:50%;
    right:-50px;
    top:-80px;
    animation:spin 8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.hero h1{
    font-size:clamp(28px,5vw,50px);
    margin-bottom:12px;
}

.hero h1 span{
    color:#00e5ff;
    text-shadow:0 0 20px rgba(0,229,255,.4);
}

.hero p{
    color:#9fb0c8;
    line-height:1.7;
    max-width:700px;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin:25px 0;
}

.card{
    background:rgba(12,25,45,.82);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:22px;
    transition:.3s;
    animation:slideUp .8s ease;
}

.card:hover{
    transform:translateY(-6px);
    border-color:rgba(0,229,255,.4);
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.card small{
    color:#8295ae;
}

.card h2{
    margin-top:10px;
    font-size:26px;
}

.green{
    color:#00ff88;
}

.red{
    color:#ff5577;
}

/* GRID */
.dashboard{
    display:grid;
    grid-template-columns:1.5fr .8fr;
    gap:20px;
}

/* PANEL */
.panel{
    background:rgba(12,25,45,.84);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
    animation:slideUp .8s ease;
}

.panel-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.panel-title h3{
    font-size:18px;
}

.badge{
    padding:6px 10px;
    border-radius:20px;
    background:rgba(0,255,136,.1);
    color:#00ff88;
    font-size:11px;
}

/* PRICE */
.price-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#071321;
    padding:18px;
    border-radius:14px;
    margin-bottom:15px;
}

.symbol{
    font-weight:bold;
    font-size:17px;
}

.price{
    font-size:27px;
    font-weight:bold;
    transition:.3s;
}

.price.flash{
    animation:priceFlash .4s ease;
}

@keyframes priceFlash{
    50%{
        color:#00e5ff;
        transform:scale(1.05);
    }
}

/* CHART */
.chart{
    height:280px;
    position:relative;
    overflow:hidden;
    border-radius:14px;
    background:
        linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:50px 50px;
}

#chartCanvas{
    width:100%;
    height:100%;
}

/* FORM */
label{
    display:block;
    color:#8295ae;
    font-size:12px;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:13px;
    margin-bottom:14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.09);
    background:#071321;
    color:#fff;
    outline:none;
}

input:focus,
select:focus{
    border-color:#00e5ff;
    box-shadow:0 0 12px rgba(0,229,255,.12);
}

.trade-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    border:none;
    padding:14px;
    border-radius:10px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

button:hover{
    transform:translateY(-3px);
    filter:brightness(1.15);
}

button:active{
    transform:scale(.96);
}

.buy{
    background:linear-gradient(135deg,#00b86b,#00ff88);
    color:#03130b;
    box-shadow:0 0 18px rgba(0,255,136,.15);
}

.sell{
    background:linear-gradient(135deg,#ff385d,#ff5577);
    box-shadow:0 0 18px rgba(255,85,119,.15);
}

/* ROBOT */
.robot-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px;
    background:#071321;
    border-radius:12px;
    margin-bottom:15px;
}

.switch{
    width:54px;
    height:29px;
    border-radius:30px;
    background:#334155;
    position:relative;
    cursor:pointer;
    transition:.3s;
}

.switch::after{
    content:"";
    width:22px;
    height:22px;
    position:absolute;
    top:3.5px;
    left:4px;
    background:white;
    border-radius:50%;
    transition:.3s;
}

.switch.active{
    background:#00c875;
    box-shadow:0 0 18px rgba(0,200,117,.4);
}

.switch.active::after{
    left:28px;
}

/* POSITIONS */
.position{
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:10px;
    align-items:center;
    padding:15px;
    background:#071321;
    border-radius:12px;
    margin-bottom:9px;
    animation:positionIn .4s ease;
}

@keyframes positionIn{
    from{
        opacity:0;
        transform:translateX(-15px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.position small{
    display:block;
    color:#8295ae;
    margin-bottom:5px;
}

.close-btn{
    padding:8px 10px;
    background:#18283d;
    color:#ff5577;
    font-size:11px;
}

.empty{
    text-align:center;
    padding:25px;
    color:#71849d;
}

/* MT5 */
.mt5-status{
    padding:15px;
    border-radius:12px;
    background:rgba(0,255,136,.07);
    border:1px solid rgba(0,255,136,.17);
    color:#00ff88;
    margin-bottom:15px;
}

.connect{
    width:100%;
    background:linear-gradient(135deg,#0077ff,#00c6ff);
}

/* NOTIFICATION */
#notification{
    position:fixed;
    right:20px;
    bottom:20px;
    max-width:330px;
    padding:15px 20px;
    border-radius:12px;
    background:#10233c;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    transform:translateY(120px);
    opacity:0;
    transition:.4s;
    z-index:999;
}

#notification.show{
    transform:translateY(0);
    opacity:1;
}

/* FOOTER */
footer{
    text-align:center;
    padding:30px;
    color:#657991;
    font-size:12px;
}

/* ANIMATION */
@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */
@media(max-width:950px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard{
        grid-template-columns:1fr;
    }
}

@media(max-width:550px){
    header{
        padding:15px;
    }

    .container{
        width:94%;
    }

    .cards{
        grid-template-columns:1fr 1fr;
    }

    .card{
        padding:15px;
    }

    .card h2{
        font-size:20px;
    }

    .hero{
        padding:23px;
    }

    .position{
        grid-template-columns:1fr 1fr;
    }

    .close-btn{
        grid-column:1/-1;
    }

    .price{
        font-size:20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        Nova<span>Trade</span> AI
    </div>

    <div class="status">
        <div class="status-dot"></div>
        Demo Server Online
    </div>
</header>

<div class="container">

<section class="hero">
    <h1>AI <span>Trading Dashboard</span></h1>
    <p>
        Monitor markets, manage demo positions and control
        your automated trading strategy from one modern dashboard.
    </p>
</section>

<section class="cards">

    <div class="card">
        <small>Account Balance</small>
        <h2 id="balance">$10,000.00</h2>
    </div>

    <div class="card">
